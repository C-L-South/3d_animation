<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #f9f9f9;
}
</style>
</head>
<body>

<video id="videoPlayer" autoplay loop muted playsinline
       src="desk setup feature.m4v">
    Your browser does not support the video tag.
</video>

<script>
const video = document.getElementById("videoPlayer");

function showVideo(filename) {
    if (video.src.endsWith(filename)) return; // Optional: don't reload same video
    video.src = filename;
    video.play();
}

function showSquat() {
  video.style.background = "#f9f9f9";
    showVideo("squat.mp4");
}

function showOverhead() {
  video.style.background = "#f9f9f9";
    showVideo("overhead.mp4");
}

function showLunge() {
  video.style.background = "#f9f9f9";
    showVideo("lunge.mp4");
}

function showChild() {
  video.style.background = "#f5f6f4";
  showVideo("child.mp4");
}
function showCircle() {
  video.style.background = "#f5f6f4";
  showVideo("armCircle.mp4");
}
function showButterfly() {
  video.style.background = "#f5f6f4";
  showVideo("butterflyStretch.mp4");
}
function showCobra() {
  video.style.background = "#f5f6f4";
  showVideo("cobraStretch.mp4");
}
function showCurl() {
  video.style.background = "#f5f6f4";
  showVideo("hamstringCurl.mp4");
}
function showMarch() {
  video.style.background = "#f5f6f4";
  showVideo("march.mp4");
}
function showRaise() {
  video.style.background = "#f5f6f4";
  showVideo("shoulderRaise.mp4");
}

</script>

</body>
</html>
