<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain; /* Use "cover" to fill the screen */
    background: #f9f9f9;
}
</style>
</head>
<body>

<video autoplay loop muted playsinline>
    <source src="overhead.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>
<script>
function showVideo(filename) {
    const video = document.getElementById("videoPlayer");
    const source = document.getElementById("videoSource");

    source.src = filename;
    video.load();
    video.play();
}

function showSquat() {
    showVideo("squat.mp4");
}

function showOverhead() {
    showVideo("overhead.mp4");
}

function showLunge() {
    showVideo("lunge.mp4");
}

function showChild() {
    showVideo("child.mp4");
}

</script>
</body>
</html>
